name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: full-product/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            full-product/backend/requirements.txt
            full-product/backend/requirements.lock
            full-product/backend/requirements-dev.txt
      - run: python -m pip install -c requirements.lock -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: full-product/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: full-product/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  prototype:
    name: Prototype tests, build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prototype-browser-failures
          path: prototype/test-results/
          retention-days: 7

  containers:
    name: Container build and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: full-product
    env:
      AEGIS_COMPOSE_PROJECT: aegis-ci
      AI_PROVIDER: none
      COMPOSE_PROFILES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/configure.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 240
      - run: |
          curl --fail --retry 3 http://localhost:8000/api/ready
          curl --fail --retry 3 http://localhost:3000/api/auth/status
          docker compose exec -T api alembic current
      - name: Failure logs
        if: failure()
        run: docker compose logs --no-color --tail 100 api worker frontend postgres redis
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
